services:
  calcapp:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt      # change to "Dockerfile" to build from source
      # args:
      #   RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
    image: calcapp:latest
    container_name: calcapp
    ports:
      - "8080:8080"                        # http://<vm-ip>:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    # Limits keep a stress test from taking the whole VM. Adjust or remove.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
